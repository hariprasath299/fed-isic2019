[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedisic"
version = "0.1.0"
description = "Three-arm (pooled/local/federated) benchmark harness for Fed-ISIC2019"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "datasets>=2.19",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "Pillow>=9.0",
]

[tool.setuptools.packages.find]
include = ["fedisic*"]
